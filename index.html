<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>段落 - 在线文本排版工具 | DuanLuo.cn</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#f7f8fa;
--surface:#fff;
--text:#1a1a2e;
--border:#ddd;
--muted:#888;
}

.dark{
--bg:#111;
--surface:#1e1e1e;
--text:#e0e0e0;
--border:#333;
--muted:#666;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
transition:.3s;
}

.wrap{
max-width:1100px;
margin:auto;
padding:24px 20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
padding-bottom:20px;
border-bottom:1px solid var(--border);
margin-bottom:24px;
}

.brand h1{font-size:24px}
.brand span{font-size:12px;color:var(--muted)}

button{
padding:10px 20px;
border:none;
border-radius:4px;
cursor:pointer;
background:#0073aa;
color:#fff;
font-size:14px;
}

button:hover{opacity:.9}
button.gray{background:#888}
button.purple{background:#8e44ad}

.opts{
background:var(--surface);
border:1px solid var(--border);
padding:14px;
border-radius:6px;
display:flex;
flex-wrap:wrap;
gap:14px;
margin-bottom:18px;
font-size:14px;
}

.opts label{
display:flex;
align-items:center;
gap:6px;
}

textarea{
width:100%;
height:280px;
padding:12px;
font-family:Consolas,monospace;
font-size:13px;
border:1px solid var(--border);
border-radius:4px;
background:var(--surface);
color:var(--text);
resize:vertical;
margin-bottom:12px;
line-height:1.7;
}

.btn-row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:14px;
}

.preview{
display:none;
background:var(--surface);
border:1px solid var(--border);
padding:18px;
border-radius:4px;
line-height:1.8;
}

.preview h2,.preview h3{
color:#0073aa;
margin:.6em 0;
}

.preview p{
margin-bottom:1em;
}

footer{
text-align:center;
margin-top:40px;
padding-top:20px;
border-top:1px solid var(--border);
font-size:12px;
color:var(--muted);
}

.copy-tip{
display:none;
color:green;
font-size:12px;
}

@media(max-width:700px){
.btn-row{
flex-direction:column;
}
button{
width:100%;
}
}
</style>
</head>
<body>

<div class="wrap">

<header>
    <div class="brand">
        <h1>段落</h1>
        <span>DuanLuo.cn</span>
    </div>
    <button onclick="toggleTheme()" id="themeToggle">🌙</button>
</header>

<h2 style="margin-bottom:16px;color:#0073aa;">
WordPress 博文格式化工具 — 智能识别版
</h2>

<div class="opts">
    <label>
        子标题最大字数
        <input type="number" id="maxLen" value="80" min="30" max="200" style="width:60px">
    </label>

    <label>
        <input type="checkbox" id="wrapStrongH2" checked>
        H2 加 strong
    </label>

    <label>
        <input type="checkbox" id="wrapStrongH3" checked>
        H3 加 strong
    </label>

    <label>
        <input type="checkbox" id="addSpace" checked>
        标题/段落间加 &nbsp;
    </label>

    <label>
        <input type="checkbox" id="autoPreview" checked>
        实时预览
    </label>
</div>

<h3 style="margin-bottom:8px;">输入区</h3>
<textarea id="input" placeholder="在这里粘贴原始内容..."></textarea>

<div class="btn-row">
    <button class="purple" onclick="smartFormat()">智能格式化</button>
    <button class="gray" onclick="clearAll()">清空</button>
</div>

<h3 style="margin-bottom:8px;">输出结果</h3>
<textarea id="output" placeholder="生成后的 HTML..."></textarea>

<div class="btn-row">
    <button onclick="copyOutput()">复制输出</button>
    <span class="copy-tip" id="copyTip">✅ 已复制</span>
    <button class="purple" onclick="downloadOutput()">下载 HTML</button>
</div>

<div id="preview" class="preview"></div>

<footer>
    <a href="https://duanluo.cn" target="_blank">DuanLuo.cn</a>
</footer>

</div>

<script>
function toggleTheme(){
    document.documentElement.classList.toggle('dark');

    let dark=document.documentElement.classList.contains('dark');
    document.getElementById('themeToggle').textContent=dark?'☀️':'🌙';

    localStorage.setItem('theme',dark?'dark':'light');
}

(function(){
    if(localStorage.getItem('theme')==='dark'){
        document.documentElement.classList.add('dark');
        document.getElementById('themeToggle').textContent='☀️';
    }
})();

function smartFormat(){

    let raw=document.getElementById('input').value;
    let lines=raw.replace(/\r/g,'').split('\n');

    let wrapH2=document.getElementById('wrapStrongH2').checked;
    let wrapH3=document.getElementById('wrapStrongH3').checked;
    let addSpace=document.getElementById('addSpace').checked;
    let maxLen=parseInt(document.getElementById('maxLen').value)||80;

    let out=[];
    let isFirst=true;

    for(let line of lines){

        line=line.trim();
        if(!line) continue;

        let clean=line.replace(/<[^>]+>/g,'');

        // 第一行 H2
        if(isFirst){

            if(addSpace) out.push('&nbsp;');

            if(wrapH2){
                out.push(`<h2><strong>${clean}</strong></h2>`);
            }else{
                out.push(`<h2>${clean}</h2>`);
            }

            if(addSpace) out.push('&nbsp;');

            isFirst=false;
            continue;
        }

        // H3
        if(isLikelyHeading(clean,maxLen)){

            if(addSpace) out.push('&nbsp;');

            if(wrapH3){
                out.push(`<h3><strong>${clean}</strong></h3>`);
            }else{
                out.push(`<h3>${clean}</h3>`);
            }

            if(addSpace) out.push('&nbsp;');

        }else{

            out.push(`<p>${clean}</p>`);

            if(addSpace){
                out.push('&nbsp;');
            }
        }
    }

    let result=out.join('\n')
        .replace(/(&nbsp;\s*\n?){2,}/g,'&nbsp;\n')
        .replace(/\n{3,}/g,'\n\n')
        .replace(/&nbsp;\s*$/,'');

    document.getElementById('output').value=result;

    if(document.getElementById('autoPreview').checked){
        showPreview(result);
    }
}

function isLikelyHeading(text,maxLen){

    if(text.length>maxLen) return false;
    if(/[。.!？?；;]$/.test(text)) return false;
    if(/,$/.test(text)) return false;
    if(/^\d+$/.test(text)) return false;
    if(/^(https?:\/\/|www\.)/i.test(text)) return false;

    return true;
}

function showPreview(html){
    let preview=document.getElementById('preview');
    preview.innerHTML=html;
    preview.style.display='block';
}

function copyOutput(){
    let text=document.getElementById('output').value;

    navigator.clipboard.writeText(text);

    let tip=document.getElementById('copyTip');
    tip.style.display='inline';

    setTimeout(()=>{
        tip.style.display='none';
    },2000);
}

function downloadOutput(){
    let text=document.getElementById('output').value;

    let blob=new Blob([text],{type:'text/html'});

    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='duanluo-formatted.html';
    a.click();
}

function clearAll(){
    document.getElementById('input').value='';
    document.getElementById('output').value='';
    document.getElementById('preview').style.display='none';
}

document.getElementById('input').addEventListener('input',function(){
    if(document.getElementById('autoPreview').checked && this.value.trim()){
        smartFormat();
    }
});
</script>

</body>
</html>
