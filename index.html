        </div>
        <div class="option-item">
            <input type="checkbox" id="plainFirstLineH1" checked>

        </div>

<script>
function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function heuristicSegment(text, maxChars) {
    const t = text.replace(/\r\n/g, '\n').trim();
    if (!t) return [];
    const hardParts = t.split(/\n{2,}/).map(p => p.trim()).filter(Boolean);
    const out = [];
    for (const block of hardParts) {
        if (block.length <= maxChars) {
            out.push(block);
            continue;
        }
        let buf = '';
        let start = 0;
        for (let i = 0; i < block.length; i++) {
            const ch = block[i];
            const isEnd = /[。！？!?]/.test(ch) || (ch === '.' && /[a-zA-Z0-9]/.test(block[i - 1] || ''));
            if (isEnd || i === block.length - 1) {
                const piece = block.slice(start, i + 1).trim();
                start = i + 1;
                if (!piece) continue;
                if ((buf + piece).length <= maxChars) buf += piece;
                else {
                    if (buf) out.push(buf.trim());
                    buf = piece;
                    while (buf.length > maxChars) {
                        out.push(buf.slice(0, maxChars).trim());
                        buf = buf.slice(maxChars).trim();
                    }
                }
            }
        }
        if (buf.trim()) out.push(buf.trim());
    }
    return out.length ? out : [t];
}

function parsePlainToBlocks(text) {
    const lines = text.replace(/\r\n/g, '\n').split('\n');
    const blocks = [];
    let i = 0;
    const firstLineH1 = document.getElementById('plainFirstLineH1').checked;

    if (firstLineH1 && lines.length > 0) {
        const first = lines[0].trim();
        const second = lines[1] !== undefined ? lines[1].trim() : '';
        if (first && !/^#{1,6}\s/.test(first) && first.length <= 40 && (second === '' || lines.length > 1)) {
            blocks.push({ type: 'h', level: 1, text: first });
            i = 1;
            if (second === '') i = 2;
        }
    }

    while (i < lines.length) {
        const line = lines[i];
        const m = line.match(/^(#{1,6})\s+(.*)$/);
        if (m) {
            blocks.push({ type: 'h', level: m[1].length, text: m[2].trim() });
            i++;
            continue;
        }
        let para = [];
        while (i < lines.length && lines[i].trim() !== '') {
            if (/^(#{1,6})\s+/.test(lines[i])) break;
            para.push(lines[i]);
            i++;
        }
        if (para.length) blocks.push({ type: 'p', text: para.join('\n').trim() });
        while (i < lines.length && lines[i].trim() === '') i++;
    }
    return blocks;
}

function blocksToHtml(blocks, wrapP, blankLine) {
    const parts = [];
    const nb = '\n&nbsp;\n';
    const maxLen = parseInt(document.getElementById('plainMaxLen').value, 10) || 320;
    for (const b of blocks) {
        if (b.type === 'h') {
            const tag = 'h' + Math.min(6, Math.max(1, b.level));
            parts.push(`<${tag}>${escapeHtml(b.text)}</${tag}>`);
            if (blankLine) parts.push(nb);
        } else {
            if (wrapP) {
                const segs = heuristicSegment(b.text, maxLen);
                for (const seg of segs) {
                    parts.push(`<p>${escapeHtml(seg)}</p>`);
                    if (blankLine) parts.push(nb);
                }
            } else {
                parts.push(escapeHtml(b.text));
                if (blankLine) parts.push(nb);
            }
        }
    }
    return parts.join('\n').replace(/\n&nbsp;\n+$/, '').trim();
}

function plainTextToHtml(text) {
    const t = (text || '').trim();
    if (!t) return '';
    return blocksToHtml(
        parsePlainToBlocks(t),
        document.getElementById('plainAutoP').checked,
        document.getElementById('plainBlankLine').checked
    );
}

function setOutput(html) {
    document.getElementById('output').value = html;
    updateStats(html);
}

function runPlainPipeline() {
    const text = document.getElementById('inputPlain').value.trim();
    if (!text) { alert('请先输入正文'); return; }
    const maxLen = parseInt(document.getElementById('plainMaxLen').value, 10) || 320;
    const segmented = heuristicSegment(text, maxLen).join('\n\n');
    document.getElementById('inputPlain').value = segmented;
    updateStats(segmented);
    setOutput(plainTextToHtml(segmented));
}

function showCopyTipPlain() {
    const tip = document.getElementById('copyTip');
    tip.style.display = 'inline';
    setTimeout(() => { tip.style.display = 'none'; }, 1000);
}

function copyOutput() {
    const output = document.getElementById('output');
    if (!output.value) { alert('没有内容可复制'); return; }
    navigator.clipboard.writeText(output.value).then(showCopyTipPlain);
}

function clearPlain() {
    document.getElementById('inputPlain').value = '';
    document.getElementById('output').value = '';
    updateStats('');
}

function updateStats(text) {
    document.getElementById('charCount').textContent = '字符: ' + text.length;
    document.getElementById('lineCount').textContent = '行数: ' + (text ? text.split('\n').length : 0);
    const elementMatches = text.match(/<[a-z][a-z0-9]*[^>]*>/gi);
    document.getElementById('elementCount').textContent = '元素: ' + (elementMatches ? elementMatches.length : 0);
}

document.getElementById('inputPlain').addEventListener('input', function () {
    updateStats(this.value);
});
document.getElementById('output').addEventListener('input', function () {
    updateStats(this.value);
});
</script>
